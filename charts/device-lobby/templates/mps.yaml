---
apiVersion: v1
kind: Service
metadata:
  labels:
    app: {{ .Chart.Name }}-mps
  name: {{ .Chart.Name }}-mps
  namespace: {{ .Release.Namespace }}
spec:
  ports:
  - port: 4433
    name: http-cira
    protocol: TCP
    targetPort: 4433
  - port: 3000
    name: http-webapi
    protocol: TCP
    targetPort: 3000
  selector:
    app: {{ .Chart.Name }}-mps

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Chart.Name }}-mps
  namespace: {{ .Release.Namespace }}
spec:
  replicas: {{ .Values.mps.replicaCount }}
  selector:
    matchLabels:
      app: {{ .Chart.Name }}-mps
  template:
    metadata:
      labels:
        app: {{ .Chart.Name }}-mps
    spec:
{{/*      imagePullSecrets:*/}}
{{/*        - name: registrycredentials*/}}
      containers:
        - name: {{ .Chart.Name }}-mps
          image: {{ .Values.images.mps }}
          readinessProbe:
            httpGet:
              path: /api/v1/health
              port: 3000
            periodSeconds: 12
            timeoutSeconds: 12
            failureThreshold: 3
          env:
            - name: "MPS_LOG_LEVEL"
              value: "{{ .Values.mps.logLevel }}"   
            - name: "MPS_COMMON_NAME"
              value: "{{ include "host" . }}"
            - name: "MPS_CONNECTION_STRING"
              valueFrom:
                secretKeyRef:
                  name: {{ .Chart.Name }}-mps
                  key: connectionString
            - name: "MPS_VAULT_ADDRESS"
              value: "http://{{ .Release.Name }}-vault:8200"
            - name: "MPS_SECRETS_PATH"
              value: 'kv/data/'
            - name: "MPS_PORT"
              value: '4433'
            - name: "MPS_INSTANCE_NAME"
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP
            - name: "MPS_JWT_EXPIRATION"
              value: "{{ .Values.mps.jwtExpiration }}"
            - name: "MPS_JWT_SECRET"
              valueFrom:
                secretKeyRef:
                  name: device-mgmt-toolkit-admin-jwt
                  key: secret
            - name: "MPS_JWT_ISSUER"
              valueFrom:
                secretKeyRef:
                  name: device-mgmt-toolkit-admin-jwt
                  key: key
            - name: MPS_WEB_ADMIN_USER
              valueFrom:
                secretKeyRef:
                  name: mpsweb
                  key: user
            - name: MPS_WEB_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: mpsweb
                  key: password
            - name: MPS_VAULT_TOKEN
              valueFrom:
                secretKeyRef:
                  name: vault
                  key: vaultKey
          ports:
            - containerPort: 3000
              name: http-webapi
            - containerPort: 4433
              name: http-cira
