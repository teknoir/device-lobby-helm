---
# TCP/TLS passthrough for CIRA equivalent (port 4433)
apiVersion: networking.istio.io/v1beta1
kind: Gateway
metadata:
  name: {{ .Chart.Name }}-cira-gateway
  namespace: {{ .Release.Namespace }}
spec:
  selector:
    istio: ingressgateway
  servers:
    - port:
        number: 4433
        name: tls-4433
        protocol: TLS
      tls:
        mode: PASSTHROUGH
      hosts:
        - '{{ include "host" . }}'

---
apiVersion: networking.istio.io/v1beta1
kind: VirtualService
metadata:
  name: {{ .Chart.Name }}-cira-vs
  namespace: {{ .Release.Namespace }}
spec:
  hosts:
    - 'cira-{{ include "host" . }}'
  gateways:
    - {{ .Chart.Name }}-cira-gateway
  tls:
    - match:
        - port: 4433
          sniHosts:
            - 'cira-{{ include "host" . }}'
      route:
        - destination:
            host: mps.{{ .Release.Namespace }}.svc.cluster.local
            port:
              number: 4433

---
# JWT validation placeholder (replace issuer and jwksUri)
apiVersion: security.istio.io/v1
kind: RequestAuthentication
metadata:
  name: {{ .Chart.Name }}-jwt-remote
  namespace: demonstrations
spec:
  selector:
    matchLabels:
      app: {{ .Chart.Name }}-mpsrouter
  jwtRules:
    - issuer: "https://{{ include "host" . }}"
      audiences:
        - "device-lobby-demonstrations"
      jwksUri: "https://{{- printf "jwks-%s-%s.%s" .Chart.Name .Release.Namespace .Values.domain -}}/api/v1/keys"

---
# Authorization policy approximating "admin-acl" using a JWT claim
# Adjust claim key and value to match your token (e.g., acl == device-mgmt-toolkit-admin)
apiVersion: security.istio.io/v1beta1
kind: AuthorizationPolicy
metadata:
  name: {{ .Chart.Name }}-admin-acl
  namespace: {{ .Release.Namespace }}
spec:
  selector:
    matchLabels:
      app: {{ .Chart.Name }}-mpsrouter
  action: ALLOW
  rules:
    - when:
        - key: request.auth.claims[acl]
          values: ["device-mgmt-toolkit-admin"]