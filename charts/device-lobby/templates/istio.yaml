---
apiVersion: networking.istio.io/v1beta1
kind: VirtualService
metadata:
  name: {{ .Chart.Name }}-vs
  namespace: {{ .Release.Namespace }}
spec:
  hosts:
    - {{ include "host" . }}
  gateways:
    - teknoir/teknoir-gateway
  http:
    - match:
        - uri:
            prefix: /activate
      route:
        - destination:
            host: rps.{{ .Release.Namespace }}.svc.cluster.local
            port:
              number: 8080
    - match:
        - uri:
            prefix: /deactivate
      route:
        - destination:
            host: rps.{{ .Release.Namespace }}.svc.cluster.local
            port:
              number: 8080
    - match:
        - uri:
            prefix: /maintenance
      route:
        - destination:
            host: rps.{{ .Release.Namespace }}.svc.cluster.local
            port:
              number: 8080
    - match:
        - uri:
            exact: /mps/login/api/v1/authorize
      rewrite:
        uri: /api/v1/authorize
      route:
        - destination:
            host: mps.{{ .Release.Namespace }}.svc.cluster.local
            port:
              number: 3000
    - match:
        - uri:
            prefix: /mps/ws/relay/
      rewrite:
        uri: /relay/
      route:
        - destination:
            host: mpsrouter.{{ .Release.Namespace }}.svc.cluster.local
            port:
              number: 8003
    - match:
        - uri:
            prefix: /rps
      route:
        - destination:
            host: rps.{{ .Release.Namespace }}.svc.cluster.local
            port:
              number: 8081
    - match:
        - uri:
            prefix: /mps
      route:
        - destination:
            host: mpsrouter.{{ .Release.Namespace }}.svc.cluster.local
            port:
              number: 8003
    # Root web UI (must be last to avoid shadowing more specific routes)
    - match:
        - uri:
            prefix: /
      route:
        - destination:
            host: webui.{{ .Release.Namespace }}.svc.cluster.local
            port:
              number: 80

