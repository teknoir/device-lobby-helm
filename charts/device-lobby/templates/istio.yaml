---
apiVersion: networking.istio.io/v1beta1
kind: VirtualService
metadata:
  name: {{ .Chart.Name }}-vs
  namespace: {{ .Release.Namespace }}
spec:
  hosts:
    - {{ include "host" . }}
  gateways:
    - teknoir/teknoir-gateway
  http:
    - match:
        - uri:
            prefix: /activate
      route:
        - destination:
            host: {{ .Chart.Name }}-rps.{{ .Release.Namespace }}.svc.cluster.local
            port:
              number: 8080
    - match:
        - uri:
            prefix: /deactivate
      route:
        - destination:
            host: {{ .Chart.Name }}-rps.{{ .Release.Namespace }}.svc.cluster.local
            port:
              number: 8080
    - match:
        - uri:
            prefix: /maintenance
      route:
        - destination:
            host: {{ .Chart.Name }}-rps.{{ .Release.Namespace }}.svc.cluster.local
            port:
              number: 8080
    - match:
        - uri:
            exact: /mps/login/api/v1/authorize
      rewrite:
        uri: /api/v1/authorize
      route:
        - destination:
            host: {{ .Chart.Name }}-mps.{{ .Release.Namespace }}.svc.cluster.local
            port:
              number: 3000
    - match:
        - uri:
            prefix: /mps/ws/relay/
      rewrite:
        uri: /relay/
      route:
        - destination:
            host: {{ .Chart.Name }}-mpsrouter.{{ .Release.Namespace }}.svc.cluster.local
            port:
              number: 8003
      headers:
        request:
          add:
            X-Forwarded-Prefix: /mps/ws/relay/
    - match:
        - uri:
            prefix: /rps/
      rewrite:
        uri: /
      route:
        - destination:
            host: {{ .Chart.Name }}-rps.{{ .Release.Namespace }}.svc.cluster.local
            port:
              number: 8081
      headers:
        request:
          add:
            X-Forwarded-Prefix: /rps/

{{/*    - match:*/}}
{{/*        - uri:*/}}
{{/*            prefix: /mps/*/}}
{{/*      rewrite:*/}}
{{/*        uri: /*/}}
{{/*      route:*/}}
{{/*        - destination:*/}}
{{/*            host: {{ .Chart.Name }}-mpsrouter.{{ .Release.Namespace }}.svc.cluster.local*/}}
{{/*            port:*/}}
{{/*              number: 8003*/}}
{{/*      headers:*/}}
{{/*        request:*/}}
{{/*          add:*/}}
{{/*            X-Forwarded-Prefix: /mps/*/}}

    - match:
        - uri:
            prefix: /mps/
      rewrite:
        uri: /
      route:
        - destination:
            host: {{ .Chart.Name }}-mps.{{ .Release.Namespace }}.svc.cluster.local
            port:
              number: 3000
      headers:
        request:
          add:
            X-Forwarded-Prefix: /mps/

    # Root web UI (must be last to avoid shadowing more specific routes)
    - match:
        - uri:
            prefix: /
      route:
        - destination:
            host: {{ .Chart.Name }}-webui.{{ .Release.Namespace }}.svc.cluster.local
            port:
              number: 80

---
# TCP/TLS passthrough for CIRA equivalent (port 4433)
apiVersion: networking.istio.io/v1beta1
kind: Gateway
metadata:
  name: {{ .Chart.Name }}-cira-gateway
  namespace: {{ .Release.Namespace }}
spec:
  selector:
    istio: ingressgateway
  servers:
    - port:
        number: 4433
        name: tls-4433
        protocol: TLS
      tls:
        mode: SIMPLE
        credentialName: {{ .Release.Namespace }}-ca
      hosts:
        - '{{- printf "cira-%s.%s" .Release.Namespace .Values.domain -}}'

---
apiVersion: networking.istio.io/v1beta1
kind: VirtualService
metadata:
  name: {{ .Chart.Name }}-cira-vs
  namespace: {{ .Release.Namespace }}
spec:
  hosts:
    - '{{- printf "cira-%s.%s" .Release.Namespace .Values.domain -}}'
  gateways:
    - {{ .Chart.Name }}-cira-gateway
  tls:
    - match:
        - port: 4433
          sniHosts:
            - '{{- printf "cira-%s.%s" .Release.Namespace .Values.domain -}}'
      route:
        - destination:
            host: mps.{{ .Release.Namespace }}.svc.cluster.local
            port:
              number: 4433

