---
apiVersion: security.istio.io/v1beta1
kind: AuthorizationPolicy
metadata:
  name: {{ .Chart.Name }}-vault
  namespace: {{ .Release.Namespace }}
spec:
  selector:
    matchLabels:
      app.kubernetes.io/instance: device-lobby
      app.kubernetes.io/name: vault
      component: server
  action: ALLOW
  rules:
    - to:
        - operation:
            ports: [ "8200", "8201" ]
    - from:
        - source:
            namespaces:
              - {{ .Release.Namespace }}
