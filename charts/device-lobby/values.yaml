# Default values for installServersChart.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

domain: "teknoir.cloud"

images:
  mps: "intel/device-mgmt-toolkit-mps:latest"
  rps: "intel/device-mgmt-toolkit-rps:latest"
  webui: "intel/device-mgmt-toolkit-web-ui:latest"
  mpsrouter: "intel/device-mgmt-toolkit-mps-router:latest"
  postgres: "pgvector/pgvector:pg15"
mps:
  commonName: 
  replicaCount: 1
  logLevel: "silly"
  jwtExpiration: 1440
  webAuthEnabled: true
ui:
  replicaCount: 1
rps:
  replicaCount: 1
  logLevel: "silly"
mpsrouter:
  replicaCount: 1
vault:
  ui:
    enabled: true
    serviceType: "LoadBalancer"
  server:
    readinessProbe:
      enabled: true
      path: '/v1/sys/health?standbyok=true&sealedcode=204&uninitcode=204'


# JWKS configuration for JWT verification is TEMPORARY and should be
# replaced with our JWKS server solution in the future.
jwks:
  keys: []